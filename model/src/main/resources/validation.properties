block.error.name.pattern = B001: To the block's name applies: a) it must have a small letter at the beginning, b) it may contain single underscores to separate name parts, c) it may use camelCase, but not PascalCase or ALLCAPS, d) it may use any combinations of letters, numbers and underscores
block.error.alias.pattern = B002: The block's dataverseAlias, if present, requires an alphanumeric text including underscore and dashes. No numbers only, no underscore or dash at start or end.
block.error.displayName.blank = B003: The block's displayName may not be blank, empty or null.
block.error.displayName.size = B004: The block's displayName may not exceed ${max} characters.
block.error.schemaURI.invalid = B005: The block's global term URI failed to comply with RFC 2396.